# Runs the evals against the real model every night, three trials per case, with the
# message-quality judge. It needs the GOOGLE_API_KEY repository secret; without it the
# job explains why it did nothing and exits green.
name: Nightly evals (live model)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC every day
  workflow_dispatch:

jobs:
  live-evals:
    name: Evals with Gemini, 3 trials per case
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MODEL: gemini
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret is set
        id: key
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::notice::GOOGLE_API_KEY secret is not set; skipping the live eval run"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        if: steps.key.outputs.present == 'true'
      - name: Run the evals (fails the job below the 85% threshold)
        if: steps.key.outputs.present == 'true'
        run: uv run python -m evals.run --model gemini --trials 3 --judge --threshold 0.85 --out reports/evals
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-report-live-model
          path: reports/evals
