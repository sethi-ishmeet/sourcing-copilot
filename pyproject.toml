[project]
name = "sourcing-copilot"
version = "0.1.0"
description = "A recruiter copilot: screens a candidate against a role, drafts outreach, and waits for a human to approve before sending."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-google-genai>=3.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pytest-playwright>=0.6",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcing_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["browser: needs a built frontend; starts a real server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends() in defaults.
extend-immutable-calls = ["fastapi.Depends"]
